url: https://github.com/john-walks-slow/dsh-cd
name: john-walks-slow/dsh-cd
category: tools
description:
  en: 'In-session cd tool for DeepSeek Harness: switch the session working directory in place so relative paths in the file tools (read, write, edit, glob, grep, read_image, present) and the bash/pwsh default workdir resolve to the new directory — per-session, persisted across restarts, and without moving the session, its sandbox root or its workspace root.'
  zh: '会话内 cd 工具：原地切换工作目录，之后文件工具（read / write / edit / glob / grep / read_image / present）的相对路径与 bash / pwsh 默认工作目录都解析到新目录——按会话隔离、跨重启恢复，且不改变会话身份、沙箱根与工作区根。'
